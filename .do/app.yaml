name: marfani-steel-dashboard
region: blr
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
      repo: MarfaniSteelGroup/Marfani-Steel-management-Reporting-Dashboard
    source_dir: /
    build_command: npm install
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: NODE_VERSION
        value: "18.20.0"
        scope: BUILD_AND_RUN_TIME
      - key: PORT
        value: "3000"
        scope: RUN_TIME
      - key: ENABLE_LIVE_WORKBOOK
        value: "false"
        scope: RUN_TIME
      - key: USE_LOCAL_WORKBOOK
        value: "false"
        scope: RUN_TIME
      - key: LIVE_WORKBOOK_URL
        value: "https://www.dropbox.com/scl/fi/fiiy3o6coteasonzw49tu/New-Import-Monitoring.xlsx?rlkey=kml4r6k2dtcq9c0bjw7ambt6o&st=zrxjnwlq&dl=0"
        scope: RUN_TIME
      - key: DATABASE_URL
        value: ""
        scope: RUN_TIME
        type: SECRET
      - key: USER_SYNC_TOKEN
        value: ""
        scope: RUN_TIME
        type: SECRET

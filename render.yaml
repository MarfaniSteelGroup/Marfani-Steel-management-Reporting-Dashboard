services:
  - type: web
    name: marfani-steels-reporting-deck
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: DATABASE_URL
        fromDatabase:
          name: marfani-users-db
          property: connectionString

databases:
  - name: marfani-users-db
    plan: free
    databaseName: marfani_users
    user: marfani_app

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marfani Steels &mdash; Management Reporting Deck</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body.auth-locked > .hull { display: none; }
  .auth-gate {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #12161b;
    color: #eef0f2;
    font-family: "IBM Plex Sans", sans-serif;
  }
  .auth-gate[hidden] { display: none; }
  .auth-panel {
    width: min(420px, 100%);
    padding: 28px 24px;
    border: 1px solid #323d48;
    border-radius: 12px;
    background: #181d24;
    box-shadow: 0 18px 40px rgba(0,0,0,.25);
  }
  .auth-panel h1 { margin: 0 0 8px; font-family: Oswald, sans-serif; }
  .auth-panel p { margin: 0 0 20px; color: #8b95a1; }
  .auth-form { display: grid; gap: 14px; }
  .auth-form label { display: grid; gap: 7px; font-size: 13px; }
  .auth-form input { padding: 12px; border: 1px solid #323d48; border-radius: 8px; background: #10161b; color: #eef0f2; font: inherit; }
  .auth-form button { padding: 12px; border: 0; border-radius: 8px; background: #e08a3e; color: #111a1d; font-weight: 600; cursor: pointer; }
  .auth-error { min-height: 18px; margin: 0; color: #cc5f56; font-size: 13px; }
</style>
</head>
<body class="auth-locked">

<section class="auth-gate" id="authGate">
  <div class="auth-panel">
    <h1>Admin Login</h1>
    <p>Marfani Steels Management Reporting Deck</p>
    <form class="auth-form" id="authForm">
      <label>Admin ID <input id="authUsername" type="text" value="Admin" autocomplete="username" required></label>
      <label>Password <input id="authPassword" type="password" autocomplete="current-password" required></label>
      <p class="auth-error" id="authError" aria-live="polite"></p>
      <button type="submit">Login</button>
    </form>
  </div>
</section>

<div class="hull">

  <!-- ===== Sidebar ===== -->
  <aside class="dock" id="dock">
    <div class="dock-brand">
      <div class="brand-mark">MS</div>
      <div class="brand-text">
        <div class="brand-name">MARFANI STEELS</div>
        <div class="brand-sub">Group Reporting Deck</div>
      </div>
    </div>

    <nav class="dock-nav" id="dockNav">
      <button class="nav-item" data-route="overview">
        <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9zm0 7h6v-5H4v5zm8 0h8V11h-8v9zm0-16v5h8V4h-8z"/></svg>
        <span>Overview</span>
      </button>
      <button class="nav-item" data-route="fund-outflow">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l3.5-4 3 3L18 8"/></svg>
        <span>Daily Fund Outflow</span>
      </button>
      <button class="nav-item" data-route="fund-planning">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h10v10H4zM17 10h3v10h-3z"/></svg>
        <span>Fund Planning</span>
      </button>
      <button class="nav-item" data-route="one-view">
        <svg viewBox="0 0 24 24"><path d="M12 4C6 4 2 12 2 12s4 8 10 8 10-8 10-8-4-8-10-8zm0 13a5 5 0 110-10 5 5 0 010 10z"/></svg>
        <span>One View &ndash; BL Tracker</span>
      </button>
      <button class="nav-item" data-route="shipment-costing">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>
        <span>Shipment Costing</span>
      </button>
    </nav>

    <div class="dock-foot">
      <div class="foot-line">Source: CONTAINER_CST_&mdash;_Final.xlsm</div>
      <div class="foot-line">Prepared by MIS Department</div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="deck">
    <header class="topbar">
      <button class="burger" id="burger" aria-label="Toggle navigation">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="pageTitle">Overview</h1>
        <p id="pageSub">Consolidated management snapshot</p>
      </div>
      <div class="topbar-stamp">
        <span class="stamp-label">REPORT AS ON</span>
        <span class="stamp-date" id="asOnDate">12&ndash;SEP&ndash;2026</span>
      </div>
      <div class="admin-tools">
        <button class="admin-trigger" id="adminTrigger" type="button" aria-expanded="false" aria-controls="adminPanel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0"/></svg>
          <span>Admin</span>
        </button>
        <section class="admin-panel" id="adminPanel" hidden>
          <div class="admin-panel-heading">
            <div>
              <strong>Admin control panel</strong>
              <span>Management reporting access</span>
            </div>
            <span class="admin-status">ACTIVE</span>
          </div>
          <div class="admin-session">
            <span>Signed in as</span>
            <strong>Admin</strong>
          </div>
          <button class="admin-action" id="refreshReports" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-4L3 10m0 0V4m0 6h6M4 13a8 8 0 0 0 14.9 4L21 14m0 0v6m0-6h-6"/></svg>
            Refresh reports
          </button>
          <button class="admin-action admin-logout" id="adminLogout" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
            Log out
          </button>
        </section>
      </div>
    </header>

    <main class="stage" id="stage">
      <!-- injected content -->
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/views.js"></script>
<script>
  (() => {
    const loggedIn = sessionStorage.getItem('marfani_admin_session') === '1';
    const localRole = sessionStorage.getItem('marfani_admin_role') || '';
    const body = document.body;
    const gate = document.getElementById('authGate');
    const adminTrigger = document.getElementById('adminTrigger');
    const adminPanel = document.getElementById('adminPanel');
    const setRole = (role, username) => {
      if (role === 'admin') {
        adminTrigger.hidden = false;
        adminPanel.querySelector('.admin-session strong').textContent = username || 'Admin';
        return;
      }
      adminTrigger.hidden = true;
      adminPanel.hidden = true;
      adminTrigger.setAttribute('aria-expanded', 'false');
    };
    if (loggedIn) {
      body.classList.remove('auth-locked');
      gate.hidden = true;
      setRole(localRole, 'Admin');
    }
    document.getElementById('authForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;
      const role = username === 'Admin' && password === 'Marfani@12345' ? 'admin' :
        username === 'Viewer' && password === 'Marfani@view123' ? 'viewer' : '';
      if (role) {
        sessionStorage.setItem('marfani_admin_session', '1');
        sessionStorage.setItem('marfani_admin_role', role);
        body.classList.remove('auth-locked');
        gate.hidden = true;
        setRole(role, username);
        return;
      }
      document.getElementById('authError').textContent = 'Invalid admin ID or password.';
    });

    adminTrigger.addEventListener('click', () => {
      const isOpen = adminPanel.hidden;
      adminPanel.hidden = !isOpen;
      adminTrigger.setAttribute('aria-expanded', String(isOpen));
    });
    document.getElementById('refreshReports').addEventListener('click', () => window.location.reload());
    document.getElementById('adminLogout').addEventListener('click', async () => {
      sessionStorage.removeItem('marfani_admin_session');
      sessionStorage.removeItem('marfani_admin_role');
      try { await fetch('/logout', { redirect: 'manual' }); } catch (error) { /* Static servers may not expose logout. */ }
      window.location.reload();
    });

    fetch('/api/session').then(response => response.ok ? response.json() : null).then(session => {
      if (session) setRole(session.role, session.username);
    }).catch(() => {});
  })();
</script>
<script src="js/app.js"></script>
</body>
</html>
